[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = 
    -O3
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
    adafruit/Adafruit GFX Library@^1.13.0
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.4
