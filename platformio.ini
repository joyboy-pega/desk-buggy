[platformio]
default_envs = esp32-tft-github-watch
src_dir = src

; ============================================================================
; Primary Active Environment: ESP32-WROOM-32 + 1.8" ST7735 Color TFT
; (GitHub Telemetry Watch HUD, 160x128 Double-Buffered, Dual-Core FreeRTOS)
; ============================================================================
[env:esp32-tft-github-watch]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = 
    adafruit/Adafruit ST7735 and ST7789 Library@^1.12.0
    adafruit/Adafruit GFX Library@^1.13.0
build_flags =
    -O3

; ============================================================================
; Secondary Environment: ESP32-C3 SuperMini + 0.96" SSD1306 OLED
; ============================================================================
[env:esp32c3-oled]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
